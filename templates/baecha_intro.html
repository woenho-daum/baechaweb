<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f5f8ff">
<title>휴무일 대체근무</title>
<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
    background: #f4f7fd;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
}

.screen {
    position: relative;
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 70px 28px 42px;
    background: radial-gradient(circle at 100% 4%, rgba(218, 230, 255, .95) 0 12%, transparent 29%),
                radial-gradient(circle at 0 92%, rgba(225, 235, 255, .9) 0 13%, transparent 31%),
                linear-gradient(145deg, #f8fbff 0%, #fff 48%, #f4f8ff 100%);
}

.wave {
    position: absolute;
    pointer-events: none;
    z-index: 0;
}

.wave.top {
    width: 500px;
    height: 600px;
    right: -260px;
    top: -180px;
    border-radius: 48% 52% 60% 40%;
    background: rgba(219, 230, 252, .65);
    transform: rotate(-20deg);
}

.wave.bottom {
    width: 520px;
    height: 420px;
    left: -290px;
    bottom: -220px;
    border-radius: 50%;
    background: rgba(224, 235, 255, .72);
    transform: rotate(15deg);
}

.content {
    position: relative;
    z-index: 2;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
}

.intro-icon {
    width: 78px;
    height: 78px;
    margin-top: 10px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, .88);
    border: 1px solid rgba(74, 125, 230, .18);
    box-shadow: 0 12px 30px rgba(54, 91, 160, .10), inset 0 0 0 7px rgba(233, 240, 255, .72);
}

.intro-icon-inner {
    width: 48px;
    height: 40px;
    position: relative;
    border-radius: 13px 13px 13px 5px;
    background: linear-gradient(145deg, #5e8ef8, #2760d5);
    box-shadow: 0 8px 16px rgba(48, 99, 211, .20);
}

.intro-icon-inner:after {
    content: "";
    position: absolute;
    left: 7px;
    bottom: -6px;
    width: 14px;
    height: 14px;
    background: #3d74e3;
    clip-path: polygon(0 0, 100% 0, 0 100%);
}

.check {
    position: absolute;
    width: 21px;
    height: 12px;
    left: 13px;
    top: 11px;
    border-left: 4px solid #fff;
    border-bottom: 4px solid #fff;
    transform: rotate(-45deg);
    border-radius: 2px;
}

.headline {
    margin-top: 62px;
    text-align: center;
    color: #14284b;
    letter-spacing: -1.5px;
}

.headline .small {
    display: block;
    font-size: clamp(25px, 7vw, 32px);
    font-weight: 500;
    line-height: 1.35;
}

.headline .large {
    display: block;
    margin-top: 7px;
    font-size: clamp(35px, 9.5vw, 46px);
    font-weight: 800;
    line-height: 1.2;
    color: #316cde;
}

.divider {
    display: flex;
    align-items: center;
    gap: 13px;
    margin-top: 38px;
}

.divider span {
    display: block;
    width: 62px;
    height: 2px;
    background: #5684e8;
    opacity: .9;
}

.divider i {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #5684e8;
}

.enter-button {
    width: 100%;
    max-width: 430px;
    min-height: 150px;
    margin-top: 76px;
    border: 0;
    border-radius: 38px;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(135deg, #5b8cf4 0%, #2458cf 100%);
    box-shadow: 0 20px 35px rgba(45, 91, 192, .22), inset 0 1px 0 rgba(255, 255, 255, .25);
    font-size: clamp(48px, 14vw, 64px);
    font-weight: 800;
    letter-spacing: -3px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    transition: transform .12s ease, box-shadow .12s ease;
    font-family: inherit;
}

.enter-button .arrow {
    font-size: .72em;
    font-weight: 400;
    margin-top: 4px;
}

.enter-button:active {
    transform: translateY(3px) scale(.985);
    box-shadow: 0 10px 20px rgba(45, 91, 192, .18), inset 0 1px 0 rgba(255, 255, 255, .20);
}

.notice {
    display: flex;
    align-items: center;
    width: 100%;
    max-width: 430px;
    margin-top: 62px;
    padding: 0 12px;
    color: #243b63;
}

.lock {
    flex: 0 0 auto;
    width: 52px;
    height: 52px;
    margin-right: 17px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e5edff;
}

.lock svg {
    width: 25px;
    height: 25px;
    stroke: #3972df;
    stroke-width: 2;
    fill: none;
}

.notice-text {
    font-size: 21px;
    line-height: 1.55;
    letter-spacing: -.6px;
    font-weight: 500;
}

.operator {
    width: 100%;
    max-width: 430px;
    margin-top: auto;
    padding-top: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    color: #14284b;
    font-size: 23px;
    font-weight: 700;
    letter-spacing: -.6px;
}

.operator:before, .operator:after {
    content: "";
    height: 1px;
    flex: 1;
    background: #b9c8e4;
}

.person {
    flex: 0 0 auto;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #e5edff;
    display: flex;
    align-items: center;
    justify-content: center;
}

.person svg {
    width: 25px;
    height: 25px;
    stroke: #3972df;
    stroke-width: 2;
    fill: none;
}

@media (max-height: 720px) {
    .screen {
        padding-top: 35px;
        padding-bottom: 25px;
    }
    .headline {
        margin-top: 38px;
    }
    .divider {
        margin-top: 24px;
    }
    .enter-button {
        min-height: 105px;
        margin-top: 42px;
    }
    .notice {
        margin-top: 35px;
    }
    .operator {
        padding-top: 38px;
    }
}

@media (max-width: 360px) {
    .screen {
        padding-left: 20px;
        padding-right: 20px;
    }
    .headline .small {
        font-size: 23px;
    }
    .headline .large {
        font-size: 34px;
    }
    .enter-button {
        min-height: 125px;
        border-radius: 32px;
    }
    .notice-text {
        font-size: 20px;
    }
    .operator {
        font-size: 20px;
    }
}
</style>
</head>
<body>
<main class="screen">
    <div class="wave top"></div>
    <div class="wave bottom"></div>
    <section class="content">
        <div class="intro-icon" aria-hidden="true">
            <div class="intro-icon-inner">
                <div class="check"></div>
            </div>
        </div>
        <div class="headline">
            <span class="small">대체근무 연락을 위한</span>
            <span class="large">사전 의향 확인</span>
        </div>
        <div class="divider" aria-hidden="true">
            <span></span>
            <i></i>
            <span></span>
        </div>
        <button type="button" class="enter-button" onclick="location.href='/baechaweb';">
            <span>입장</span>
            <span class="arrow">›</span>
        </button>
        <div class="notice">
            <div class="lock" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <rect x="5" y="10" width="14" height="11" rx="2"></rect>
                    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                    <circle cx="12" cy="15.5" r="1"></circle>
                </svg>
            </div>
            <div class="notice-text">
                응답은 자율이며,<br>입력한 내용은 안전하게 관리됩니다.
            </div>
        </div>
        <div class="operator">
            <div class="person" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="3.2"></circle>
                    <path d="M5.5 20c.7-3.4 2.8-5.2 6.5-5.2s5.8 1.8 6.5 5.2"></path>
                </svg>
            </div>
            <span>운영 · 박원호</span>
        </div>
    </section>
</main>
</body>
</html>
