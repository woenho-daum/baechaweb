<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>본인 확인</title>
    <style>
        body {
            font-family: '맑은 고딕', sans-serif;
            background-color: #f4f6f9;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-top: 30px;
            text-align: center;
        }
        .info-box {
            background-color: #edf2f7;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0 30px 0;
        }
        .name {
            font-size: 32px;
            font-weight: bold;
            color: #2b6cb0;
        }
        .question {
            font-size: 22px;
            color: #2d3748;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
        }
        .btn {
            flex: 1;
            padding: 20px 0;
            font-size: 22px;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            text-decoration: none;
            cursor: pointer;
        }
        .btn-yes {
            background-color: #38a169;
            color: white;
        }
        .btn-no {
            background-color: #e53e3e;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="info-box">
            <div class="name">{{ name }} 기사님</div>
            <p style="font-size: 18px; color: #718096; margin-top: 5px;">({{ phone }})</p>
        </div>

        <div class="question">본인이 맞으십니까?</div>

        <form action="/confirm_user" method="POST">
            <input type="hidden" name="phone" value="{{ phone }}">
            <input type="hidden" name="name" value="{{ name }}">
            
            <div class="btn-group">
                <a href="/login" class="btn btn-no">아닙니다</a>
                <button type="submit" class="btn btn-yes">맞습니다</button>
            </div>
        </form>
    </div>
</body>
</html>
