<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f8fd">
<title>범일운수 | 근무표 설문조사</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f4f8fd;color:#17243a}
body{
  font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.page{
  min-height:100vh;
  padding:calc(20px + env(safe-area-inset-top)) 18px calc(190px + env(safe-area-inset-bottom));
  overflow:hidden;
}
.wrap{width:min(100%,620px);margin:auto}

/* 상단: 처음 시안의 '브랜드 + 버스 + 도시 배경' 구도 */
.hero{
  position:relative;
  height:360px;
  overflow:hidden;
  border-radius:0 0 34px 34px;
  background:
    radial-gradient(circle at 80% 20%,rgba(103,159,226,.22),transparent 31%),
    linear-gradient(180deg,#ffffff 0%,#f5f9ff 76%,#edf4fb 100%);
}
.hero:before{
  content:"";
  position:absolute;
  left:-10%;right:-10%;bottom:42px;height:112px;
  background:linear-gradient(180deg,rgba(205,220,235,.2),rgba(177,196,215,.45));
  clip-path:polygon(0 65%,8% 55%,15% 63%,23% 46%,31% 60%,39% 40%,48% 57%,57% 43%,65% 62%,74% 48%,82% 58%,91% 42%,100% 55%,100% 100%,0 100%);
  opacity:.55;
}
.hero:after{
  content:"";
  position:absolute;
  left:-8%;right:-8%;bottom:0;height:86px;
  background:linear-gradient(100deg,#e4edf6,#fff 46%,#d9e6f2);
  transform:skewY(-2deg);
  opacity:.95;
}
.brand{
  position:relative;z-index:3;
  padding:32px 24px 0;
  font-size:35px;font-weight:900;letter-spacing:-2.2px;color:#0e397c;
}
.subtitle{
  position:relative;z-index:3;
  padding:5px 24px 0;
  color:#1b6dce;font-size:20px;font-weight:800;letter-spacing:-1px;
}
.message{
  position:relative;z-index:3;
  padding:15px 24px 0;
  color:#4e6078;font-size:14px;line-height:1.75;
}

/* 장식용 버스 — 사진 대신 CSS 일러스트 */
.bus{
  position:absolute;z-index:2;
  right:-20px;bottom:40px;
  width:310px;height:142px;
  border-radius:25px 20px 15px 15px;
  transform:skewX(-3deg);
  background:linear-gradient(#fff 0 57%,#edf1f5 57% 100%);
  border:2px solid #d6e0ea;
  box-shadow:0 18px 30px rgba(44,77,111,.22);
}
.bus-window{
  position:absolute;left:25px;top:15px;width:226px;height:51px;
  border-radius:11px 10px 5px 5px;
  background:linear-gradient(135deg,#263d55,#738aa0);
  border:3px solid #dfe7ef;
}
.bus-window:after{
  content:"";
  position:absolute;left:96px;top:0;height:100%;width:3px;background:#aab9c8;
}
.bus-stripe{
  position:absolute;left:0;right:0;top:86px;height:19px;
  background:linear-gradient(100deg,#dcecff 0 22%,#2474c9 22% 48%,#8eb8e5 48% 100%);
}
.bus-text{
  position:absolute;right:20px;bottom:22px;
  color:#2266aa;font-size:12px;font-weight:900;transform:skewX(3deg)
}
.wheel{
  position:absolute;bottom:-19px;width:47px;height:47px;border-radius:50%;
  background:#263344;border:8px solid #d5dee7;
}
.w1{left:43px}.w2{right:38px}

/* 로그인 카드 */
.card{
  position:relative;z-index:5;
  margin:-5px 10px 0;
  background:rgba(255,255,255,.98);
  border:1px solid #e1e9f2;
  border-radius:28px;
  padding:29px 24px 25px;
  box-shadow:0 18px 48px rgba(37,76,117,.12);
}
.login-title{
  display:flex;justify-content:center;align-items:center;gap:11px;
  color:#122d59;font-size:27px;font-weight:900;letter-spacing:-1.4px;
}
.person{
  width:31px;height:31px;border:3px solid #2572cf;border-radius:50%;
  position:relative;
}
.person:before{
  content:"";position:absolute;width:8px;height:8px;border:2px solid #2572cf;
  border-radius:50%;left:8px;top:4px;background:white;
}
.person:after{
  content:"";position:absolute;width:16px;height:8px;border:2px solid #2572cf;
  border-bottom:0;border-radius:10px 10px 0 0;left:4px;bottom:4px;
}
.guide{text-align:center;color:#718096;font-size:14px;margin:9px 0 25px}
.field{margin-bottom:18px}
label{display:block;margin:0 0 8px 2px;font-size:15px;font-weight:800}
.input{
  position:relative;
}
.icon{
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;color:#8ca1ba;
}
.icon.person-small:before{
  content:"";position:absolute;width:7px;height:7px;border:2px solid #8ca1ba;
  border-radius:50%;left:5px;top:0;
}
.icon.person-small:after{
  content:"";position:absolute;width:15px;height:8px;border:2px solid #8ca1ba;
  border-bottom:0;border-radius:10px 10px 0 0;left:1px;bottom:0;
}
.icon.phone-small:before{
  content:"⌕";font-size:28px;line-height:20px;color:#8ca1ba;
}
input{
  width:100%;height:58px;border:1.5px solid #dbe5ef;border-radius:14px;
  outline:0;background:#fff;color:#17243a;padding:0 15px 0 48px;
  font-size:16px;transition:.18s;
}
input::placeholder{color:#9aabc0}
input:focus{border-color:#4c91df;box-shadow:0 0 0 4px rgba(37,114,207,.10)}
.hint{font-size:12px;color:#91a0b2;margin:7px 3px 0}
.login{
  width:100%;height:58px;margin-top:3px;border:0;border-radius:14px;
  background:linear-gradient(135deg,#2878d8,#1260c7);
  color:white;font-size:17px;font-weight:900;cursor:pointer;
  box-shadow:0 10px 22px rgba(22,102,203,.24);
}
.login:active{transform:scale(.995)}
.arrow{float:right;font-size:28px;font-weight:300;line-height:16px;margin-right:2px}
.secure{text-align:center;margin-top:17px;color:#91a0b1;font-size:12px}

/* 키보드가 올라왔을 때 시각적으로 답답하지 않도록 하단을 의도적으로 비워둠 */
.bottom-space{
  height:170px;
  display:flex;align-items:flex-end;justify-content:center;
  color:#aab7c7;font-size:11px;
}
.bottom-space span{
  padding:7px 12px;border-radius:20px;background:#eaf1f8;
}
.footer{text-align:center;color:#8a99ad;font-size:11px;padding-bottom:10px}
.footer strong{display:block;color:#65758b;margin-bottom:6px;font-size:12px}

.toast{
  position:fixed;z-index:20;left:50%;bottom:28px;
  width:calc(100% - 36px);max-width:520px;
  padding:14px 17px;border-radius:14px;
  background:#16263e;color:#fff;text-align:center;font-size:14px;
  transform:translate(-50%,130px);transition:.25s;
  box-shadow:0 12px 30px rgba(0,0,0,.22);
}
.toast.show{transform:translate(-50%,0)}

@media(max-width:390px){
  .hero{height:335px}
  .brand{font-size:31px}
  .subtitle{font-size:18px}
  .bus{width:275px;right:-45px}
  .card{padding-left:20px;padding-right:20px}
}
@media(min-width:700px){
  .page{padding-bottom:100px}
  .hero{height:385px}
  .card{margin-left:30px;margin-right:30px;padding:34px 38px 29px}
  .bottom-space{height:90px}
}
</style>
</head>
<body>
<main class="page">
<div class="wrap">
  <section class="hero">
    <div class="brand">범일운수</div>
    <div class="subtitle">근무표 설문조사 시스템</div>
    <div class="message">더 나은 근무환경을 만들기 위해<br>기사 여러분의 소중한 의견을 들려주세요.</div>

    <div class="bus" aria-hidden="true">
      <div class="bus-window"></div>
      <div class="bus-stripe"></div>
      <div class="bus-text">BUMIL · 범일운수</div>
      <div class="wheel w1"></div>
      <div class="wheel w2"></div>
    </div>
  </section>

  <section class="card">
    <div class="login-title"><i class="person"></i>로그인</div>
    <div class="guide">사번과 전화번호를 입력해주세요.</div>

    <form id="loginForm">
      <div class="field">
        <label for="employee">사번</label>
        <div class="input">
          <i class="icon person-small"></i>
          <input id="employee" inputmode="numeric" autocomplete="username"
                 placeholder="사번을 입력하세요" required>
        </div>
      </div>

      <div class="field">
        <label for="phone">전화번호</label>
        <div class="input">
          <i class="icon phone-small"></i>
          <input id="phone" type="tel" inputmode="tel" autocomplete="tel"
                 placeholder="전화번호를 입력하세요" required>
        </div>
        <div class="hint">- 포함하여 입력해주세요. 예) 010-1234-5678</div>
      </div>

      <button class="login" type="submit">로그인 <span class="arrow">→</span></button>
    </form>

    <div class="secure">🔒 입력하신 정보는 안전하게 보호됩니다.</div>
  </section>

  <div class="bottom-space"><span>모바일 입력 최적화</span></div>

  <footer class="footer">
    <strong>🚌 범일운수 근무표 설문조사 시스템</strong>
    © 2026 BUMIL Transportation. All rights reserved.
  </footer>
</div>
</main>

<div id="toast" class="toast"></div>

<script>
const form=document.getElementById("loginForm");
const phone=document.getElementById("phone");
const toast=document.getElementById("toast");

phone.addEventListener("input",()=>{
  let v=phone.value.replace(/\D/g,"").slice(0,11);
  if(v.length>7) v=v.replace(/(\d{3})(\d{4})(\d{1,4})/,"$1-$2-$3");
  else if(v.length>3) v=v.replace(/(\d{3})(\d{1,4})/,"$1-$2");
  phone.value=v;
});

form.addEventListener("submit",e=>{
  e.preventDefault();
  toast.textContent="로그인 정보를 확인하고 있습니다.";
  toast.classList.add("show");
  clearTimeout(window.t);
  window.t=setTimeout(()=>toast.classList.remove("show"),2200);
  // 실제 서버 연결 시 이 부분에 로그인 API를 연결하면 됩니다.
});
</script>
</body>
</html>
